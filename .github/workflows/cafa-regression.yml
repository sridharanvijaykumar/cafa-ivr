name: CAFA-IVR CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-reproduce:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CAFA-IVR and test dependencies
        run: pip install -e '.[dev]'

      - name: Run unit and empirical reproduction tests
        run: pytest -q

      - name: Smoke-test CLI on measured 360-trial input
        run: |
          cafa-ivr score \
            --input empirical/conformer_360_cafa_input.csv \
            --out ci_reproduced

      - name: Upload reproduced results
        uses: actions/upload-artifact@v4
        with:
          name: cafa-ivr-reproduced-360
          path: ci_reproduced/
